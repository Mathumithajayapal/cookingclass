<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>CulinaryStudio | Join the Community</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23D35400' d='M416 0C400 0 288 32 288 176V288c0 35.3 28.7 64 64 64h32V480c0 17.7 14.3 32 32 32s32-14.3 32-32V352 176 64c0-35.3-28.7-64-64-64zM64 16C64 7.8 57.9 1 49.7 .1S34.2 4.6 32.4 12.5L2.1 148.8C.7 155.1 0 161.5 0 167.9c0 45.9 35.1 83.6 80 87.7V480c0 17.7 14.3 32 32 32s32-14.3 32-32V255.6c44.9-4.1 80-41.8 80-87.7c0-6.4-.7-12.8-2.1-19.1L191.6 12.5c-1.8-8-9.3-13.3-17.4-12.4S160 7.8 160 16V150.2c0 5.4-4.4 9.8-9.8 9.8c-5.1 0-9.3-3.9-9.8-9L127.9 14.6C127.2 6.3 120.3 0 112 0s-15.2 6.3-15.9 14.6L83.7 151c-.5 5.1-4.7 9-9.8 9c-5.4 0-9.8-4.4-9.8-9.8V16z'/></svg>"
    type="image/svg+xml">

  <!-- Tailwind + Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Core Variables */
    :root {
      --accent-color: #D35400;
      /* Culinary Orange */
      --accent-hover: #A04000;
      --text-main: #2C2A28;
    }

    body {
      font-family: 'Inter', sans-serif;
      transition: background 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      /* Unique Culinary Background */
      background-image: linear-gradient(rgba(253, 251, 247, 0.95), rgba(253, 251, 247, 0.95)), url('images/cookingclass (6).jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Logo Specific Utility Classes */
    .brand-logo {
      font-family: 'Playfair Display', serif;
      color: var(--text-main);
    }

    /* LIGHT MODE */
    body:not(.dark-mode) .card-container {
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 50px -12px rgba(211, 84, 0, 0.15), 0 0 0 1px rgba(211, 84, 0, 0.05);
      border: 1px solid #E6E2D8;
    }

    body:not(.dark-mode) input {
      background-color: #FDFBF7 !important;
      border: 1px solid #E6E2D8 !important;
      color: #2C2A28 !important;
    }

    body:not(.dark-mode) input::placeholder {
      color: #6B655B !important;
      opacity: 0.7;
    }

    body:not(.dark-mode) input:focus {
      border-color: var(--accent-color) !important;
      box-shadow: 0 0 0 3px rgba(211, 84, 0, 0.15);
    }

    body:not(.dark-mode) label {
      color: #2C2A28 !important;
      font-weight: 600;
    }

    /* DARK MODE */
    body.dark-mode {
      background-image: linear-gradient(rgba(18, 18, 18, 0.95), rgba(18, 18, 18, 0.95)), url('images/cookingclass (6).jpg');
    }

    body.dark-mode .brand-logo {
      color: #ffffff !important;
    }

    body.dark-mode .card-container {
      background-color: rgba(30, 30, 30, 0.95) !important;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border: 1px solid #333333;
    }

    body.dark-mode input {
      background-color: #1A1A1A !important;
      border: 1px solid #333333 !important;
      color: #EAE6DF !important;
    }

    body.dark-mode input::placeholder {
      color: #A39E93 !important;
    }

    body.dark-mode input:focus {
      border-color: var(--accent-color) !important;
      box-shadow: 0 0 0 3px rgba(211, 84, 0, 0.25);
    }

    body.dark-mode label {
      color: #EAE6DF !important;
    }

    /* Social button base styling */
    .social-auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    /* Light mode - social */
    body:not(.dark-mode) .social-auth-btn {
      background-color: #FDFBF7;
      border-color: #E6E2D8;
    }

    body:not(.dark-mode) .social-auth-btn:hover {
      background-color: #F4F1EA;
      border-color: var(--accent-color);
    }

    body:not(.dark-mode) .google-icon {
      color: #4285F4;
    }

    body:not(.dark-mode) .instagram-icon {
      color: #E4405F;
    }

    body:not(.dark-mode) .apple-icon {
      color: #1e293b;
    }

    /* Dark mode - social */
    body.dark-mode .social-auth-btn {
      background-color: #1A1A1A;
      border-color: #333333;
    }

    body.dark-mode .social-auth-btn:hover {
      background-color: #2A2A2A;
      border-color: var(--accent-color);
    }

    body.dark-mode .google-icon {
      color: #4285F4;
    }

    body.dark-mode .instagram-icon {
      color: #E4405F;
    }

    body.dark-mode .apple-icon {
      color: #ffffff;
    }

    /* Button text styling */
    .social-auth-btn .btn-text {
      font-size: 0.75rem;
      font-weight: 500;
    }

    body:not(.dark-mode) .social-auth-btn .btn-text {
      color: #2C2A28;
    }

    body.dark-mode .social-auth-btn .btn-text {
      color: #EAE6DF;
    }

    /* Card styling - optimized to fit without scroll on desktop */
    .card-container {
      transition: background-color 0.4s ease, box-shadow 0.4s;
      max-width: 500px;
      width: 100%;
      border-radius: 1.5rem;
      margin: 0 auto;
      overflow: visible;
    }

    .rtl-flip {
      transform: scaleX(-1);
      display: inline-block;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }

    .submit-arrow {
      transition: transform 0.2s ease;
    }

    /* Password wrapper */
    .password-wrapper {
      position: relative;
      width: 100%;
    }

    /* FIXED TOGGLE BUTTONS OUTSIDE CARD */
    .fixed-toggles {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 12px;
      background: rgba(253, 251, 247, 0.95);
      backdrop-filter: blur(12px);
      padding: 8px 14px;
      border-radius: 60px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      border: 1px solid #E6E2D8;
      transition: all 0.2s ease;
    }

    body.dark-mode .fixed-toggles {
      background: rgba(26, 26, 26, 0.95);
      border-color: #333;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .toggle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    body.dark-mode .toggle-btn {
      color: #EAE6DF;
    }

    .toggle-btn:hover {
      background: var(--accent-color);
      color: white;
      transform: scale(1.05);
    }

    body.rtl .fixed-toggles {
      right: auto;
      left: 20px;
    }

    /* SIGN UP BUTTON */
    #submitBtn {
      min-height: 52px;
      background: var(--accent-color);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
      border: none;
      cursor: pointer;
    }

    #submitBtn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      white-space: nowrap;
    }

    /* Optimized spacing - Same as template */
    input {
      width: 100%;
      font-size: 15px !important;
      padding: 12px 16px !important;
      border-radius: 12px !important;
    }

    label {
      margin-bottom: 6px;
      font-size: 0.85rem;
    }

    /* ===== DESKTOP OPTIMIZATION ===== */
    @media (min-width: 1024px) {
      body {
        padding: 20px;
      }

      .card-container {
        max-width: 480px;
      }

      .card-container>div {
        padding: 1.75rem !important;
      }

      .space-y-6>*+* {
        margin-top: 1rem;
      }

      .mb-8 {
        margin-bottom: 1.25rem;
      }

      .my-8 {
        margin-top: 1.25rem;
        margin-bottom: 1.25rem;
      }

      .mt-8 {
        margin-top: 1rem;
      }

      .mt-6 {
        margin-top: 1rem;
      }

      .py-4 {
        padding-top: 0.875rem;
        padding-bottom: 0.875rem;
      }

      h2.text-2xl {
        font-size: 1.5rem !important;
      }

      .text-sm {
        font-size: 0.8rem;
      }
    }

    /* ===== RESPONSIVE ADJUSTMENTS FOR MOBILE ===== */
    @media (max-width: 768px) {
      body {
        padding: 70px 16px 20px 16px;
      }

      .card-container {
        max-width: 100%;
      }

      .card-container>div {
        padding: 1.25rem !important;
      }

      .fixed-toggles {
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        gap: 8px;
      }

      body.rtl .fixed-toggles {
        right: auto;
        left: 12px;
      }

      .toggle-btn {
        width: 36px;
        height: 36px;
      }

      #submitBtn {
        min-height: 48px;
        font-size: 0.9rem;
      }

      h2.text-2xl {
        font-size: 1.35rem !important;
      }

      input {
        padding: 10px 14px !important;
      }

      .social-auth-btn .btn-text {
        display: none;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 68px 12px 16px 12px;
      }

      .card-container>div {
        padding: 1rem !important;
      }

      .fixed-toggles {
        top: 10px;
        right: 10px;
        padding: 5px 8px;
      }

      .toggle-btn {
        width: 34px;
        height: 34px;
        font-size: 0.85rem;
      }

      .btn-content {
        white-space: normal;
        text-align: center;
      }

      #submitBtn {
        min-height: 46px;
        font-size: 0.85rem;
      }

      .space-y-6>*+* {
        margin-top: 0.875rem;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 64px 10px 16px 10px;
      }

      .grid-cols-2 {
        gap: 8px;
      }

      #submitBtn {
        min-height: 44px;
        font-size: 0.8rem;
      }
    }

    /* Landscape mode */
    @media (max-height: 700px) and (orientation: landscape) {
      body {
        padding: 50px 20px 20px 20px;
      }

      .card-container {
        max-height: calc(100vh - 70px);
        overflow-y: auto;
      }

      .card-container::-webkit-scrollbar {
        width: 4px;
      }

      .card-container::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 4px;
      }

      body.dark-mode .card-container::-webkit-scrollbar-track {
        background: #2d3a4e;
      }

      .card-container::-webkit-scrollbar-thumb {
        background: #D35400;
        border-radius: 4px;
      }
    }

    /* Social buttons grid */
    .grid-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .grid-cols-3 button {
      transition: all 0.2s ease;
    }

    .grid-cols-3 button:hover {
      transform: translateY(-2px);
    }

    .social-auth-btn i {
      font-size: 1.2rem;
    }

    /* Divider text contrast overrides */
    .text-gray-500 {
      color: #6B655B !important;
    }

    body.dark-mode .text-gray-500 {
      color: #A39E93 !important;
    }
  </style>
</head>

<body>

  <!-- FIXED TOGGLE BUTTONS OUTSIDE CARD -->
  <div class="fixed-toggles">
    <button id="darkModeToggle" class="toggle-btn" aria-label="Dark/Light mode">
      <svg id="darkModeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
    <button id="rtlToggle" class="toggle-btn" aria-label="RTL/LTR mode">
      <span id="rtlIconText">LTR</span>
    </button>
  </div>

  <!-- MAIN CARD -->
  <div id="mainCard" class="card-container bg-white rounded-2xl shadow-2xl overflow-hidden transition-all duration-300">
    <div class="p-6 sm:p-7">

      <!-- IDENTICAL BRAND HEADER -->
      <div class="flex items-center justify-center mb-6 pb-5 border-b border-gray-200/60 dark:border-gray-700/60">
        <a href="index.html" class="text-2xl brand-logo tracking-widest uppercase flex items-center whitespace-nowrap"
          style="text-decoration: none;">
          <i class="fas fa-utensils"
            style="color: var(--accent-color); margin-right: 0.45em; font-size: 0.9em; vertical-align: middle; filter: drop-shadow(0 0 4px rgba(211,84,0,0.35));"></i>CulinaryStudio
        </a>
      </div>

      <!-- Welcome section -->
      <div class="mb-5 text-center">
        <h2 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-white tracking-tight brand-logo">Join the
          Studio</h2>
        <p class="text-gray-600 dark:text-gray-400 text-xs md:text-sm mt-2 font-medium">Create an account to book your
          classes</p>
      </div>

      <!-- Sign-up Form (Exact sizes as template) -->
      <form id="signupForm" class="space-y-4">
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-bold mb-1.5">Full name</label>
          <input type="text" name="fullname" id="fullname" required placeholder="Chef Name"
            class="w-full px-4 py-2.5 rounded-xl border transition-all duration-200 text-sm font-medium">
        </div>

        <!-- Email Address -->
        <div>
          <label class="block text-xs font-bold mb-1.5">Email address</label>
          <input type="email" name="email" id="email" required placeholder="student@culinarystudio.com"
            class="w-full px-4 py-2.5 rounded-xl border transition-all duration-200 text-sm font-medium">
        </div>

        <!-- Password -->
        <div class="password-wrapper relative">
          <label class="block text-xs font-bold mb-1.5">Password</label>
          <!-- Changed pr-10 to pe-10 -->
          <input type="password" name="password" id="password" required placeholder="••••••••"
            class="w-full px-4 py-2.5 pe-10 rounded-xl border transition-all duration-200 text-sm font-medium">
          <!-- Changed right-3 to end-3 -->
          <i class="fa-solid fa-eye absolute end-3 bottom-3 cursor-pointer" style="color: var(--accent-color);"
            id="togglePassword"></i>
        </div>

        <!-- Confirm Password -->
        <div class="password-wrapper relative">
          <label class="block text-xs font-bold mb-1.5">Confirm Password</label>
          <!-- Changed pr-10 to pe-10 -->
          <input type="password" name="confirm_password" id="confirm_password" required placeholder="Confirm ••••••••"
            class="w-full px-4 py-2.5 pe-10 rounded-xl border transition-all duration-200 text-sm font-medium">
          <!-- Changed right-3 to end-3 -->
          <i class="fa-solid fa-eye absolute end-3 bottom-3 cursor-pointer" style="color: var(--accent-color);"
            id="toggleConfirm"></i>
        </div>

        <!-- Terms & Conditions Checkbox -->
        <div class="flex items-start gap-2 mt-1">
          <input type="checkbox" id="termsCheckbox"
            class="mt-0.5 w-3.5 h-3.5 rounded border-gray-300 text-[#D35400] focus:ring-[#D35400]/40 focus:ring-2 cursor-pointer">
          <label for="termsCheckbox" class="text-xs font-medium cursor-pointer select-none leading-relaxed"
            style="color: inherit;">
            I agree to the
            <a href="#" id="termsLink" class="font-semibold hover:underline"
              style="color: var(--accent-color);">Terms</a>
            and
            <a href="#" id="privacyLink" class="font-semibold hover:underline"
              style="color: var(--accent-color);">Privacy Policy</a>
          </label>
        </div>

        <!-- Sign Up Button -->
        <button type="submit" id="submitBtn"
          class="w-full py-3 rounded-xl font-bold text-sm transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2 group mt-3 cursor-pointer">
          <span class="btn-content">Join the Studio <span
              class="text-base submit-arrow transition-transform group-hover:translate-x-1">→</span></span>
        </button>
      </form>

      <!-- Divider -->
      <div class="my-5 flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
        <span class="text-[10px] font-bold uppercase tracking-wider text-gray-500">Or sign up with</span>
        <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
      </div>

      <!-- Social Sign Up Buttons -->
      <div class="grid grid-cols-3 gap-3">
        <!-- Google -->
        <button id="googleBtn" class="social-auth-btn border py-2.5 rounded-xl shadow-sm transition-all duration-200">
          <i class="fa-brands fa-google google-icon"></i>
          <span class="btn-text">Google</span>
        </button>

        <!-- Instagram -->
        <button id="instagramBtn"
          class="social-auth-btn border py-2.5 rounded-xl shadow-sm transition-all duration-200">
          <i class="fa-brands fa-instagram instagram-icon"></i>
          <span class="btn-text">Instagram</span>
        </button>

        <!-- Apple -->
        <button id="appleBtn" class="social-auth-btn border py-2.5 rounded-xl shadow-sm transition-all duration-200">
          <i class="fa-brands fa-apple apple-icon"></i>
          <span class="btn-text">Apple</span>
        </button>
      </div>

      <!-- Login Redirect Link -->
      <p class="text-center text-xs font-medium mt-5" style="color: inherit; opacity: 0.8;">
        Already a student?
        <!-- Changed ml-1 to ms-1 -->
        <a href="login.html" id="loginLink" class="font-extrabold hover:underline ms-1"
          style="color: var(--accent-color); opacity: 1;">Login →</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      // Dark Mode Logic
      const darkModeToggle = document.getElementById('darkModeToggle');
      const body = document.body;
      const htmlElement = document.documentElement;

      const savedDark = localStorage.getItem('culinary_dark');
      if (savedDark === 'enabled') {
        body.classList.add('dark-mode');
        updateDarkIcon(true);
      } else {
        body.classList.remove('dark-mode');
        updateDarkIcon(false);
      }

      function updateDarkIcon(isDark) {
        const iconSvg = document.getElementById('darkModeIcon');
        if (isDark) {
          iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />';
        } else {
          iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
        }
      }

      darkModeToggle.addEventListener('click', () => {
        const isDarkNow = body.classList.toggle('dark-mode');
        localStorage.setItem('culinary_dark', isDarkNow ? 'enabled' : 'disabled');
        updateDarkIcon(isDarkNow);
      });

      // RTL / LTR Toggle
      const rtlToggleBtn = document.getElementById('rtlToggle');
      const rtlIconSpan = document.getElementById('rtlIconText');

      function applyDirection(dir) {
        if (dir === 'rtl') {
          htmlElement.setAttribute('dir', 'rtl');
          body.classList.add('rtl');
          rtlIconSpan.innerText = 'RTL';
          localStorage.setItem('culinary_rtl', 'enabled');
          const arrowSpan = document.querySelector('.submit-arrow');
          if (arrowSpan) arrowSpan.classList.add('rtl-flip');
        } else {
          htmlElement.setAttribute('dir', 'ltr');
          body.classList.remove('rtl');
          rtlIconSpan.innerText = 'LTR';
          localStorage.setItem('culinary_rtl', 'disabled');
          const arrowSpan = document.querySelector('.submit-arrow');
          if (arrowSpan) arrowSpan.classList.remove('rtl-flip');
        }
      }

      const savedDir = localStorage.getItem('culinary_rtl');
      if (savedDir === 'enabled') applyDirection('rtl');
      else applyDirection('ltr');

      rtlToggleBtn.addEventListener('click', () => {
        const currentDir = htmlElement.getAttribute('dir');
        const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
        applyDirection(newDir);
      });

      // Form Validation
      const form = document.getElementById('signupForm');
      const submitBtn = document.getElementById('submitBtn');
      const fullnameInput = document.getElementById('fullname');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirm_password');
      const termsCheckbox = document.getElementById('termsCheckbox');

      const originalBtnHTML = submitBtn.innerHTML;

      function showBtnMessage(message, isError = true) {
        if (isError) {
          submitBtn.innerHTML = `<span class="btn-content">⚠️ ${message}</span>`;
          submitBtn.style.background = '#dc2626';
        } else {
          submitBtn.innerHTML = `<span class="btn-content">✓ ${message}</span>`;
          submitBtn.style.background = '#16a34a';
        }
        setTimeout(() => {
          submitBtn.innerHTML = originalBtnHTML;
          submitBtn.style.background = 'var(--accent-color)';
        }, 2400);
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const fullname = fullnameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;
        const termsAccepted = termsCheckbox.checked;

        if (!fullname) {
          showBtnMessage('Full name is required', true);
          fullnameInput.focus();
          return;
        }
        if (!email) {
          showBtnMessage('Email address required', true);
          emailInput.focus();
          return;
        }
        if (!email.includes('@') || !email.includes('.')) {
          showBtnMessage('Enter a valid email', true);
          emailInput.focus();
          return;
        }
        if (!password) {
          showBtnMessage('Please create a password', true);
          passwordInput.focus();
          return;
        }
        if (password.length < 6) {
          showBtnMessage('Password must be at least 6 characters', true);
          passwordInput.focus();
          return;
        }
        if (password !== confirm) {
          showBtnMessage('Passwords do not match', true);
          confirmInput.focus();
          return;
        }
        if (!termsAccepted) {
          showBtnMessage('You must accept Terms & Privacy Policy', true);
          termsCheckbox.focus();
          return;
        }

        showBtnMessage('Account created! Redirecting...', false);
        setTimeout(() => {
          form.reset();
          window.location.href = "login.html";
        }, 1500);
      });

      // Social auth demo
      document.getElementById('googleBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        alert('🔐 Google Sign-Up: Connect your Google account to CulinaryStudio.');
      });

      document.getElementById('instagramBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        alert('📸 Instagram Sign-Up: Connect your Instagram account.');
      });

      document.getElementById('appleBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        alert('🍎 Apple Sign-Up: Secure sign-in with Apple ID.');
      });

      // Links demo
      document.getElementById('termsLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        alert('CulinaryStudio Terms of Service: Cancellation policies, class etiquette, and booking terms.');
      });

      document.getElementById('privacyLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        alert('CulinaryStudio Privacy Policy: Your data is secure and never shared without consent.');
      });
    })();

    // Password toggle functionality
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (togglePassword && passwordInput) {
      togglePassword.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        togglePassword.classList.toggle('fa-eye');
        togglePassword.classList.toggle('fa-eye-slash');
      });
    }

    // Confirm password toggle
    const toggleConfirm = document.getElementById('toggleConfirm');
    const confirmInput = document.getElementById('confirm_password');

    if (toggleConfirm && confirmInput) {
      toggleConfirm.addEventListener('click', () => {
        const type = confirmInput.type === 'password' ? 'text' : 'password';
        confirmInput.type = type;
        toggleConfirm.classList.toggle('fa-eye');
        toggleConfirm.classList.toggle('fa-eye-slash');
      });
    }
  </script>
</body>

</html>
